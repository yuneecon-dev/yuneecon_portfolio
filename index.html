<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안녕하세요! 저를 소개합니다 ✨</title>
  
  <!-- 구글 폰트 (Noto Sans KR & Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* 기본 리셋 및 전체 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #FAF8F5; /* 따뜻하고 감성적인 아이보리 톤 */
      color: #333333;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 카드 컨테이너 */
    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 50px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    /* 프로필 이미지/아바타 영역 */
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      margin: 0 auto 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
    }

    /* 환영 메시지 & 이름 */
    .badge {
      display: inline-block;
      background-color: #F0E6FF;
      color: #7C4DFF;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 15px;
    }

    p.intro {
      font-size: 1rem;
      color: #666;
      margin-bottom: 30px;
      word-break: keep-all;
    }

    /* 태그 목록 (관심사/키워드) */
    .tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .tag {
      background-color: #F3F4F6;
      color: #4B5563;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    /* 소셜 링크 버튼 */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 14px;
      border-radius: 12px;
      background-color: #333333;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #7C4DFF;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(124, 77, 255, 0.3);
    }

    /* 푸터 */
    footer {
      margin-top: 35px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 이모지 또는 프로필 사진 영역 -->
    <div class="profile-img">
      ✨
    </div>

    <!-- 환영 인사 -->
    <span class="badge">WELCOME TO MY PAGE</span>
    <h1>안녕하세요, [이름]입니다! 👋</h1>
    
    <!-- 짧은 소개글 -->
    <p class="intro">
      새로운 도전과 매일의 작은 일상을 기록하는 공간입니다.<br>
      함께 이야기 나누고 성장하는 것을 좋아합니다.
    </p>

    <!-- 내 키워드 / 관심사 -->
    <div class="tags">
      <span class="tag">🎨 디자인</span>
      <span class="tag">💻 개발</span>
      <span class="tag">☕ 커피</span>
      <span class="tag">✈️ 여행</span>
    </div>

    <!-- 링크 / 연락처 버튼 -->
    <div class="links">
      <a href="https://instagram.com" target="_blank" class="btn">📷 인스타그램 방문하기</a>
      <a href="mailto:your-email@example.com" class="btn">✉️ 이메일로 연락하기</a>
    </div>

    <!-- 저작권/푸터 -->
    <footer>
      © 2026 [이름]. All rights reserved.
    </footer>
  </div>

</body>
</html>
